name: Prerelease

# Builds unsigned prerelease binaries for macOS, Windows, Linux and Android.
# Run it from the Actions tab, or push a v* tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish the prerelease under'
        required: true
        default: v0.1.0-pre.1
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # Each build job appends its own files to this release. Assets go straight
  # to the release rather than through actions/upload-artifact, which keeps
  # multi-hundred-MB installers out of the Actions artifact storage quota.
  prepare:
    name: Create draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create or reuse the release
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; build jobs will add to it."
            exit 0
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "DragonFableHelper $TAG" \
            --prerelease \
            --notes-file - <<'NOTES'
          ## DragonFableHelper (prerelease)

          > **Automating DragonFable violates Artix Entertainment's Terms of Service
          > and can get your account banned.** Use at your own risk, on an account you
          > are willing to lose. Not affiliated with Artix Entertainment.

          ### Downloads

          | Platform | File |
          | --- | --- |
          | macOS (Apple Silicon) | `*-mac-arm64.dmg` |
          | macOS (Intel) | `*-mac-x64.dmg` |
          | Windows | `*-win-x64-setup.exe` (installer) or `*-win-x64-portable.exe` |
          | Linux | `*-linux-x86_64.AppImage` or `*-linux-amd64.deb` |
          | Android | `*-android.apk` |

          ### These builds are unsigned

          - **macOS** will refuse to open it: right-click the app and choose *Open*, or
            run `xattr -dr com.apple.quarantine /Applications/DragonFableHelper.app`.
          - **Windows** SmartScreen will warn: *More info* then *Run anyway*.
          - **Android** needs "install from unknown sources". This is a debug-signed
            build, so it will not upgrade over a differently-signed install.

          ### What works

          The app starts on a built-in **mock DragonFable** - quests, multi-wave
          battles, drops, cooldowns and death - so you can try the bot, the rotations
          and the script panel with no game client at all.

          The live Ruffle bridge loads the real client, but its symbol map still needs
          filling in against a running game; see the README section
          *Wiring the live bridge* and use `bridge.probe()`.
          NOTES

  desktop:
    name: Desktop (${{ matrix.os }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build web bundle
        run: pnpm --filter @dfh/ui build

      - name: Build main process
        run: pnpm --filter @dfh/host-electron build

      # electron-builder targets the host platform by default, so each runner
      # produces its own formats from the shared electron-builder.yml.
      - name: Package
        run: pnpm --filter @dfh/host-electron package

      # bash on every runner (Windows included) so the globs expand the same way.
      - name: Upload to release
        shell: bash
        run: |
          shopt -s nullglob
          files=(packages/host-electron/release/*.dmg
                 packages/host-electron/release/*.zip
                 packages/host-electron/release/*.exe
                 packages/host-electron/release/*.AppImage
                 packages/host-electron/release/*.deb)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No installers were produced" >&2
            exit 1
          fi
          printf 'Uploading %s\n' "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber

  android:
    name: Android
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Gradle's syncWebBundle task copies this into the APK's assets.
      - name: Build web bundle
        run: pnpm --filter @dfh/ui build

      # Pinned: the runner ships Gradle 9.x, which AGP 8.7 does not support.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # Debug rather than release: a release APK would be unsigned and refuse
      # to install. The debug signing key makes the prerelease installable.
      - name: Assemble APK
        working-directory: packages/host-android
        run: gradle assembleDebug --no-daemon

      # The whole mobile design rests on the web bundle being inside the APK.
      # If the copy silently produced nothing the app would still install and
      # then show a blank screen, so assert it rather than trust it.
      - name: Verify the APK carries the web bundle
        working-directory: packages/host-android
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          echo "APK size: $(du -h "$APK" | cut -f1)"
          contents=$(unzip -l "$APK")
          for required in assets/dfh/index.html assets/dfh/assets; do
            if ! grep -q "$required" <<<"$contents"; then
              echo "::error::APK is missing $required - the web bundle did not make it in"
              exit 1
            fi
          done
          echo "Bundled web assets:"
          grep 'assets/dfh/' <<<"$contents"

      - name: Upload to release
        run: |
          cp packages/host-android/app/build/outputs/apk/debug/app-debug.apk \
             "DragonFableHelper-${TAG}-android.apk"
          gh release upload "$TAG" "DragonFableHelper-${TAG}-android.apk" \
             --repo "$GITHUB_REPOSITORY" --clobber
